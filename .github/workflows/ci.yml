name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Ubuntu 24.04 is the supported floor: GTK 4.14, libadwaita 1.5.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p kaka
      - uses: actions/upload-artifact@v7
        with:
          name: kaka_linux_x64
          path: |
            target/release/kaka
            data/io.github.spaghetticodez.kaka.desktop
            data/icons/io.github.spaghetticodez.kaka.svg
          retention-days: 14
